<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">ShopEasy</div>

    <input type="text" id="search" placeholder="Search products...">

    <button id="cartBtn">
        🛒 Cart (<span id="cartCount">0</span>)
    </button>
</header>

<section class="hero">
    <h1>Welcome to ShopEasy</h1>
    <p>Find your favourite products at the best prices.</p>
</section>

<div class="categories">
    <button onclick="filterProducts('All')">All</button>
    <button onclick="filterProducts('Clothes')">Clothes</button>
    <button onclick="filterProducts('Shoes')">Shoes</button>
    <button onclick="filterProducts('Electronics')">Electronics</button>
</div>

<main id="productContainer"></main>

<!-- Cart -->
<div id="cartBox" class="cart-box">
    <div class="cart-header">
        <h2>Your Cart</h2>
        <button onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems"></div>

    <h3>Total: ₹<span id="cartTotal">0</span></h3>

    <button class="checkout" onclick="checkout()">
        Checkout
    </button>
</div>

<script src="script.js"></script>

</body>
</html>
